<div class="offcanvas offcanvas-end show" tabindex="-1" style="visibility: visible; width: 300px;" id="userProfileOffcanvas">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title">{{user.name}}</h5>
        <button type="button" class="btn-close" ng-click="close()"></button>
    </div>
    <div class="offcanvas-body text-center">
        <img ng-src="{{user.avatar}}" class="rounded-circle mb-3" width="100" height="100" />
        <p>{{user.bio}}</p>
    </div>
</div>
<div class="offcanvas-backdrop fade show"></div>
