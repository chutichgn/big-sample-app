<!-- src/components/top-nav/top-nav.html -->
<nav class="navbar fixed-top navbar-light bg-white navbar-top">

    <div class="container-fluid">
        <a class="navbar-brand" href="#">
            <img src="https://getbootstrap.com/docs/5.0/assets/brand/bootstrap-logo.svg" alt="" width="30" height="24">
        </a>
        <span class="navbar-brand  truncate" ng-click="$ctrl.toggleModal()" ng-bind="$ctrl.title"></span>
        <a class="nav-link ms-auto" ui-sref="app.profile" ui-sref-active="active">
            <i class="bi bi-person-circle"></i>
        </a>
    </div>
</nav>

<!-- Modal for full text -->
<div class="modal fade" tabindex="-1" ng-class="{ 'show d-block': $ctrl.isModalOpen }" aria-hidden="{{ !$ctrl.isModalOpen }}">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Full Application Name</h5>
                <button type="button" class="btn-close" ng-click="$ctrl.toggleModal()" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p>{{ $ctrl.title }}</p>
            </div>
        </div>
    </div>
</div>
